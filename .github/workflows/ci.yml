name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20', '22']

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Build packages
      run: npm run build

    - name: Run tests with coverage
      run: npm run test:coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Typecheck and build all packages
      run: npm run build

  docker:
    name: Docker Build Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: docker build -t csd-bg-scraper:test .

    - name: Test Docker image
      run: |
        mkdir -p ./data
        docker run --rm csd-bg-scraper:test --help

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test, quality]

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Build CLI
      run: npm run build

    - name: Create data directory
      run: mkdir -p ./data

    - name: Run application help (smoke test)
      run: node packages/cli/dist/index.js --help

    - name: Check data directory exists
      run: ls -la ./data/

  notify:
    name: Notification
    runs-on: ubuntu-latest
    needs: [test, quality, docker, integration]
    if: always()

    steps:
    - name: Check job status
      run: |
        if [ "${{ needs.test.result }}" = "success" ] && [ "${{ needs.quality.result }}" = "success" ] && [ "${{ needs.docker.result }}" = "success" ]; then
          echo "All checks passed!"
        else
          echo "Some checks failed!"
          exit 1
        fi

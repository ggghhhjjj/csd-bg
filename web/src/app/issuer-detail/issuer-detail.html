<section class="issuer-detail">
  @if (issuer(); as current) {
    <h2 class="issuer-detail__name">{{ current.name }}</h2>
    <p class="issuer-detail__isin">{{ current.isin }}</p>
    @if (dataset(); as data) {
      <app-period-diffs
        [dataset]="data"
        [issuerIndex]="issuerIndex()"
        [startDate]="viewRange().from"
        [endDate]="viewRange().to"
      />
      <app-chart-panel
        [dataset]="data"
        [issuerIndex]="issuerIndex()"
        (viewRangeChange)="viewRange.set($event)"
      />
      <app-metrics-table [dataset]="data" [issuerIndex]="issuerIndex()" />
    }
  } @else if (dataset()) {
    <p class="issuer-detail__missing">{{ i18n.text('issuer.missing') }}</p>
  }
</section>

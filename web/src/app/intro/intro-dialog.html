@if (intro.open(); as isOpen) {
  <div class="intro-dialog" role="dialog" aria-modal="true" [attr.aria-label]="i18n.text('intro.dialogLabel')">
    <button class="intro-dialog__backdrop" type="button" (click)="close()" [attr.aria-label]="i18n.text('intro.close')"></button>
    <section class="intro-dialog__panel">
      <header class="intro-dialog__header">
        <h2 class="intro-dialog__title">{{ i18n.text('intro.dialogTitle') }}</h2>
        <button class="intro-dialog__close" type="button" (click)="close()" [attr.aria-label]="i18n.text('intro.close')">
          <svg class="intro-dialog__close-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              d="M6 6l12 12M18 6L6 18"
            />
          </svg>
        </button>
      </header>
      <div class="intro-dialog__body">
        @if (frameSrc(); as src) {
          <iframe class="intro-dialog__frame" [src]="src" [title]="i18n.text('intro.frameTitle')" loading="lazy"></iframe>
        }
      </div>
    </section>
  </div>
}

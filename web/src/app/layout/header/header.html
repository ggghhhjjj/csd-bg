<header class="header">
  <div class="header__nav">
    @if (showHome()) {
      <button class="header__action header__icon-btn" type="button" (click)="goHome()" [attr.aria-label]="i18n.text('header.home')">
        <svg class="header__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3 12l9-9 9 9M5 10v10h5v-6h4v6h5V10"
          />
        </svg>
      </button>
    }
  </div>
  <div class="header__brand">
    <h1 class="header__title">{{ i18n.text('header.title') }}</h1>
    @if (cachedOnLabel()) {
      <p class="header__cached-on" [attr.aria-label]="cachedOnAria()">{{ cachedOnLabel() }}</p>
    }
  </div>
  <div class="header__actions">
    <button class="header__action" type="button" (click)="switchLocale()">{{ i18n.text('header.locale') }}</button>
    <button
      class="header__action header__icon-btn"
      type="button"
      (click)="share()"
      [attr.aria-label]="i18n.text('header.share')"
    >
      @if (shareCopied()) {
        <svg class="header__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M5 12l5 5L20 7"
          />
        </svg>
      } @else {
        <svg class="header__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M4 12v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6M16 6l-4-4-4 4M12 2v13"
          />
        </svg>
      }
    </button>
    <div class="header__menu" (click)="$event.stopPropagation()">
      <button
        class="header__action header__icon-btn"
        type="button"
        (click)="toggleMenu($event)"
        aria-haspopup="menu"
        [attr.aria-expanded]="menuOpen()"
        [attr.aria-label]="i18n.text('header.menu')"
      >
        <svg class="header__icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="6" r="1.5" fill="currentColor" />
          <circle cx="12" cy="12" r="1.5" fill="currentColor" />
          <circle cx="12" cy="18" r="1.5" fill="currentColor" />
        </svg>
      </button>
      @if (menuOpen()) {
        <ul class="header__menu-list" role="menu">
          <li role="none">
            <button
              class="header__menu-item"
              type="button"
              role="menuitem"
              (click)="refresh()"
              [disabled]="store.loading()"
            >
              {{ i18n.text('header.refresh') }}
            </button>
          </li>
          <li role="none">
            <button class="header__menu-item" type="button" role="menuitem" (click)="openIntro()">
              {{ i18n.text('header.help') }}
            </button>
          </li>
        </ul>
      }
    </div>
    <span class="header__live" aria-live="polite">
      @if (shareCopied()) {
        {{ i18n.text('header.shareCopied') }}
      }
    </span>
  </div>
</header>

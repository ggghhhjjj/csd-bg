<header class="header">
  <div class="header__nav">
    @if (showBack()) {
      <button class="header__action" type="button" (click)="goBack()" [attr.aria-label]="i18n.text('header.back')">
        {{ i18n.text('header.back') }}
      </button>
    }
  </div>
  <h1 class="header__title">{{ i18n.text('header.title') }}</h1>
  <div class="header__actions">
    <button class="header__action" type="button" (click)="switchLocale()">{{ i18n.text('header.locale') }}</button>
    <button class="header__action" type="button" (click)="refresh()" [disabled]="store.loading()">
      {{ i18n.text('header.refresh') }}
    </button>
  </div>
</header>

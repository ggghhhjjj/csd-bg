<header class="header">
  <div class="header__nav">
    @if (showBack()) {
      <button class="header__action" type="button" (click)="goBack()" [attr.aria-label]="backLabel">
        {{ backLabel }}
      </button>
    }
  </div>
  <h1 class="header__title">{{ titleLabel }}</h1>
  <div class="header__actions">
    <button class="header__action" type="button" (click)="switchLocale()">{{ localeLabel }}</button>
    <button class="header__action" type="button" (click)="refresh()" [disabled]="store.loading()">
      {{ refreshLabel }}
    </button>
  </div>
</header>

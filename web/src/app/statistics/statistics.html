<section class="statistics">
  @if (dataset(); as data) {
    <app-range-presets [activePreset]="activePreset()" (presetChange)="setPreset($event)" />
    <app-shareholders-diff-rank
      [dataset]="data"
      [startDate]="diffRankRange().from"
      [endDate]="diffRankRange().to"
      [order]="rankOrder()"
      [showAll]="showAllRank()"
      [changeFilter]="rankChangeFilter()"
      [listExpanded]="rankListExpanded()"
      (orderChange)="onRankOrderChange($event)"
      (showAllChange)="onShowAllRankChange($event)"
      (changeFilterChange)="onRankChangeFilterChange($event)"
      (listExpandedChange)="onRankListExpandedChange($event)"
    />
    <app-shareholders-diff-rank-chart
      [dataset]="data"
      [startDate]="diffRankRange().from"
      [endDate]="diffRankRange().to"
      [order]="rankOrder()"
      [showAll]="showAllRank()"
      [changeFilter]="rankChangeFilter()"
    />
    <app-shareholders-market-charts
      [dataset]="data"
      [startDate]="viewRange().from"
      [endDate]="viewRange().to"
      [viewStart]="chartSliderRange().from"
      [viewEnd]="chartSliderRange().to"
      [selectedDate]="selectedChartDate()"
      (dateSelected)="onChartDateSelected($event)"
      (viewRangeChange)="onChartViewRangeChange($event)"
      (viewRangeSettled)="onChartViewRangeSettled($event)"
    />
  }
</section>

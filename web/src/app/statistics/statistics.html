<section class="statistics">
  @if (dataset(); as data) {
    <app-range-presets [preset]="preset()" (presetChange)="setPreset($event)" />
    <app-shareholders-diff-rank
      [dataset]="data"
      [startDate]="diffRankRange().from"
      [endDate]="diffRankRange().to"
      [focusDate]="selectedRankDate()"
    />
    <app-shareholders-flow-daily-chart
      [dataset]="data"
      [startDate]="viewRange().from"
      [endDate]="viewRange().to"
      [selectedDate]="selectedRankDate()"
      (dateSelect)="onFlowDateSelect($event)"
    />
    <app-shareholders-total-daily-chart [dataset]="data" [startDate]="viewRange().from" [endDate]="viewRange().to" />
  }
</section>

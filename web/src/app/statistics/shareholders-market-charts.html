<section class="shareholders-market-charts">
  @if (!hasData()) {
    <p class="shareholders-market-charts__empty">{{ i18n.text('stats.empty') }}</p>
  }
  <div class="shareholders-market-charts__panels" [class.shareholders-market-charts__panels--hidden]="!hasData()">
    <app-shareholders-flow-daily-chart
      [aggregate]="aggregate()"
      [viewStart]="chartViewStart()"
      [viewEnd]="chartViewEnd()"
      [selectedDate]="selectedDate()"
      (viewRangeChange)="onChartViewRangeChange($event)"
      (dateSelected)="dateSelected.emit($event)"
    />
    <app-shareholders-total-daily-chart
      [aggregate]="aggregate()"
      [viewStart]="chartViewStart()"
      [viewEnd]="chartViewEnd()"
      [selectedDate]="selectedDate()"
      (viewRangeChange)="onChartViewRangeChange($event)"
      (dateSelected)="dateSelected.emit($event)"
    />
    <app-shareholders-total-period-daily-chart
      [aggregate]="aggregate()"
      [viewStart]="chartViewStart()"
      [viewEnd]="chartViewEnd()"
      [selectedDate]="selectedDate()"
      (viewRangeChange)="onChartViewRangeChange($event)"
      (dateSelected)="dateSelected.emit($event)"
    />
  </div>
</section>

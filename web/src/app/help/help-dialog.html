@if (help.open()) {
  <div class="help-dialog" role="dialog" aria-modal="true" [attr.aria-label]="i18n.text('help.dialogLabel')">
    <button class="help-dialog__backdrop" type="button" (click)="close()" [attr.aria-label]="i18n.text('help.close')"></button>
    <section class="help-dialog__panel">
      <header class="help-dialog__header">
        <h2 class="help-dialog__title">{{ i18n.text('help.dialogTitle') }}</h2>
        <button class="help-dialog__close" type="button" (click)="close()" [attr.aria-label]="i18n.text('help.close')">
          <svg class="help-dialog__close-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              d="M6 6l12 12M18 6L6 18"
            />
          </svg>
        </button>
      </header>
      <div class="help-dialog__body">
        @if (frameSrc(); as src) {
          <iframe class="help-dialog__frame" [src]="src" [title]="i18n.text('help.frameTitle')" loading="lazy"></iframe>
        }
      </div>
    </section>
  </div>
}
